services:
  rabbitmq:
    image: rabbitmq:4.2.5-management-alpine
    container_name: cogfather-rabbitmq
    network_mode: host
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  postgres:
    image: postgres:18.3-alpine3.23
    container_name: cogfather-postgres
    network_mode: host
    environment:
      POSTGRES_USER: cogfather
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: hq_database