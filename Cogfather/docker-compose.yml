services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: cogfather-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  hq:
    build:
      context: .
      dockerfile: Cogfather.HQ.UI/Dockerfile
    container_name: cogfather-hq
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__HqDb: "Data Source=/data/cogfather-hq.db"
      ConnectionStrings__AuthDb: "Data Source=/data/cogfather-auth.db"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      RecipeBook__FilePath: /app/recipes.json
      Serilog__WriteTo__2__Args__uri: http://loki:3100
    volumes:
      - hq-data:/data
      - ./recipes.json:/app/recipes.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_started

  node-alpha:
    build:
      context: .
      dockerfile: Cogfather.Node.Worker/Dockerfile
    container_name: cogfather-node-alpha
    environment:
      Node__Id: "aaaaaaaa-0000-0000-0000-000000000001"
      Node__DisplayName: "Worker Node Alpha"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Fault__ActiveFault: 0
      Serilog__WriteTo__2__Args__uri: http://loki:3100
    depends_on:
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_started

  node-beta:
    build:
      context: .
      dockerfile: Cogfather.Node.Worker/Dockerfile
    container_name: cogfather-node-beta
    environment:
      Node__Id: "bbbbbbbb-0000-0000-0000-000000000002"
      Node__DisplayName: "Worker Node Beta"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Fault__ActiveFault: 0
      Serilog__WriteTo__2__Args__uri: http://loki:3100
    depends_on:
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_started

  node-gamma:
    build:
      context: .
      dockerfile: Cogfather.Node.Worker/Dockerfile
    container_name: cogfather-node-gamma
    environment:
      Node__Id: "cccccccc-0000-0000-0000-000000000003"
      Node__DisplayName: "Worker Node Gamma"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Fault__ActiveFault: 0
      Serilog__WriteTo__2__Args__uri: http://loki:3100
    depends_on:
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: cogfather-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - hq

  loki:
    image: grafana/loki:latest
    container_name: cogfather-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    container_name: cogfather-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  rabbit-data:
  hq-data:
  prometheus-data:
  loki-data:
  grafana-data:
