apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogfather-node-alpha
  namespace: cogfather
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cogfather-node-alpha
  template:
    metadata:
      labels:
        app: cogfather-node-alpha
    spec:
      containers:
        - name: node
          image: cogfather-node:latest
          imagePullPolicy: Never
          env:
            - name: Node__Id
              value: "aaaaaaaa-0000-0000-0000-000000000001"
            - name: Node__DisplayName
              value: "Worker Node Alpha"
            - name: RabbitMq__Host
              value: rabbitmq
            - name: RabbitMq__Port
              value: "5672"
            - name: RabbitMq__Username
              value: guest
            - name: RabbitMq__Password
              value: guest
            - name: Fault__ActiveFault
              value: "0"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
