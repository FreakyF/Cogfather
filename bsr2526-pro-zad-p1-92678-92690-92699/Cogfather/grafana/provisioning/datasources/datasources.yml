apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: cogfather-prometheus
    url: http://prometheus:9090
    isDefault: true
    access: proxy
    editable: false

  - name: Loki
    type: loki
    uid: cogfather-loki
    url: http://loki:3100
    access: proxy
    editable: false
    jsonData:
      maxLines: 1000
